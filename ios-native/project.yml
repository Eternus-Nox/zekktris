name: Zekktris
options:
  bundleIdPrefix: com.zekktris
  createIntermediateGroups: true
  deploymentTarget:
    # iOS 17 minimum — required for INTERACTIVE widgets (App Intents fired from
    # a widget Button, e.g. the one-tap poke). Raised from 16 deliberately.
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Keep in sync with Info.plist CFBundleShortVersionString / pbxproj
    # MARKETING_VERSION so a future `xcodegen generate` doesn't regress the
    # shipping version. Bump all three together on release.
    MARKETING_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "6"
    # Apple Developer Team — set here (not only in Xcode) so `xcodegen generate`
    # doesn't drop code signing and break the archive. Applies to all targets.
    DEVELOPMENT_TEAM: "4QF34MB8R3"
  configs:
    # APNs environment per build config, substituted into aps-environment in
    # Zekktris.entitlements via $(APS_ENVIRONMENT). Release/Archive (TestFlight +
    # App Store) = production to match the server (APNS_PRODUCTION=true) so the
    # CallKit VoIP push + notifications actually arrive; Debug (Xcode Run) =
    # development/sandbox.
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.14.1"

targets:
  Zekktris:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Zekktris
    dependencies:
      - package: LiveKit
      # Bundles + embeds the Notification Service Extension into the app so it
      # can decrypt E2EE message previews on-device (xcodegen auto-adds it to
      # the Embed App Extensions build phase).
      - target: NotificationService
      # Bundles + embeds the Share Extension, which is what makes Zekktris appear
      # in the system share sheet at all. The donated INSendMessageIntents
      # (ShareSuggestions) populate the suggested-people row, but iOS only offers
      # those suggestions for an app that can actually RECEIVE the share —
      # without this target the donations surfaced nothing, which is exactly the
      # "no recent contacts in the share sheet" symptom.
      - target: ShareExtension
        embed: true
      # Bundles + embeds the watchOS companion ("Zekktris" on the watch) into the app
      # so it ships to a paired Apple Watch (Embed Watch Content phase).
      - target: ZekktrisWatch
        embed: true
      # Bundles + embeds the WidgetKit extension (Home/Lock-Screen "Quick DM"
      # widget) into the app (Embed Foundation Extensions phase).
      - target: ZekktrisWidgets
        embed: true
      # Bundles + embeds the SiriKit Messaging extension so "send a message to
      # <name> on Zekktris" works without launching the app.
      - target: ZekktrisIntents
        embed: true
    info:
      path: Zekktris/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # false so the "Designed for iPad" build is resizable / full-screenable
        # on Apple Silicon Macs (true pins the window to a fixed iPad canvas).
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # All four orientations are REQUIRED on iPad once UIRequiresFullScreen
        # is false: a multitasking-capable iPad app must support them all, or
        # App Store validation rejects the build (ITMS-90474). PortraitUpsideDown
        # is the one App Store Connect flagged as missing.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Deep-link scheme so the Home/Lock-Screen widget can open a DM
        # (zekktris://dm/<channelId>) — handled by .onOpenURL in ZekktrisApp.
        CFBundleURLTypes:
          - CFBundleURLName: com.zekktris.native
            CFBundleURLSchemes:
              - zekktris
        NSMicrophoneUsageDescription: "Zekktris uses your microphone for voice channels, calls, and voice messages."
        NSCameraUsageDescription: "Zekktris uses your camera for video calls, to set your avatar, and to scan the sign-in code shown on another device."
        NSPhotoLibraryAddUsageDescription: "Zekktris can save images you receive to your photo library."
        NSFaceIDUsageDescription: "Zekktris uses Face ID to unlock the app and keep your conversations private."
        NSContactsUsageDescription: "Zekktris adds a contact's Zekktris handle to their card, so you can message them by their real name — including with Siri. It only writes to cards you pick."
        NSSiriUsageDescription: "Zekktris lets you send messages with Siri. Siri is told who you talk to and what you dictate, so it can send the message for you."
        # HOW SIRI HEARS THE APP NAME. "Zekktris" is an invented word, and
        # speech recognition almost never spells it with the double k. On the
        # iPhone that is forgiven — Siri matches App Shortcut phrases flexibly.
        # On Apple Watch it is NOT: phrases must match EXACTLY, so a
        # transcription of "Zektris" fails the "\(.applicationName)" token and
        # Siri answers "You'll need an app for me to help with that".
        # CFBundleSpokenName is the pronunciation (also used by VoiceOver);
        # INAlternativeAppNames (max 3) are extra spellings the
        # `.applicationName` token accepts. Do not repeat the display name.
        CFBundleSpokenName: "Zeck triss"
        INAlternativeAppNames:
          - INAlternativeAppName: Zektris
            INAlternativeAppNamePronunciationHint: zeck triss
          - INAlternativeAppName: Zeck Tris
            INAlternativeAppNamePronunciationHint: zeck triss
          - INAlternativeAppName: Zecktris
            INAlternativeAppNamePronunciationHint: zeck triss

        UIBackgroundModes:
          - audio
          - voip
          - remote-notification
    entitlements:
      path: Zekktris/Zekktris.entitlements
      properties:
        # Per-config via $(APS_ENVIRONMENT) (see settings.configs below): Debug
        # = development/sandbox, Release/Archive = production. TestFlight + App
        # Store builds MUST be production to match the server's APNs
        # (APNS_PRODUCTION=true) — otherwise PushKit VoIP (CallKit ringing) and
        # notifications never arrive on the beta.
        aps-environment: $(APS_ENVIRONMENT)
        # Shared with the NotificationService extension. Used as a keychain
        # access group so the extension can read per-DM E2EE keys to decrypt
        # message previews. MUST be registered as an App Group in the Apple
        # Developer account and enabled on BOTH targets (see AppGroupConfig.swift).
        com.apple.security.application-groups:
          - group.com.zekktris.native
        # Passkeys (WebAuthn). Binds the app to zekktris.com so the system
        # passkey sheet will create/use credentials for that rpID, verified
        # against https://zekktris.com/.well-known/apple-app-site-association.
        # Declared HERE (not just in the .entitlements file) so a future
        # `xcodegen generate` regenerates the entitlement instead of dropping it.
        # Requires the Associated Domains capability on the com.zekktris.native
        # App ID (automatic signing enables it on archive; verify in the portal).
        com.apple.developer.associated-domains:
          - webcredentials:zekktris.com
        # SiriKit (Messaging domain) — "send a message to <name> on Zekktris",
        # handled by the ZekktrisIntents extension. UNLIKE the communication
        # entitlement below, this one IS self-serve: enable **SiriKit** for the
        # com.zekktris.native App ID in the Apple Developer portal. If it is not
        # enabled there, signing fails with "Entitlement com.apple.developer.siri
        # not found and could not be included in profile" — remove this key and
        # the ZekktrisIntents target to get building again.
        com.apple.developer.siri: true
        # DO NOT ADD `com.apple.developer.usernotifications.communication`.
        # Tried 2026-09-04 and it breaks signing: Xcode reports "Entitlement
        # ... not found and could not be included in profile" because it is not
        # a self-serve capability — there is no toggle for it on the App ID, it
        # has to be requested from Apple. The communication notifications the
        # NotificationService extension applies do NOT need it: donating an
        # INSendMessageIntent is what authorises `updating(from:)`.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconSunset IconForest IconCrimson IconBlossom IconAmethyst"
        # Set your Apple Developer Team in Xcode (Signing & Capabilities)
        # or uncomment and fill in here:
        # DEVELOPMENT_TEAM: XXXXXXXXXX

  # Notification Service Extension — decrypts E2EE DM message previews
  # on-device. Reuses E2EE.swift + AppGroupConfig.swift (compiled directly, no
  # LiveKit) and reads the per-DM key from the shared app-group keychain. The
  # server ships the ciphertext with mutable-content so this runs before the
  # notification is shown; see apps/api/src/routes/messages.ts.
  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        # MUST match the app's version/build or App Store upload is rejected.
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # The NSExtensionActivationSupports* keys MUST be nested inside
            # NSExtensionActivationRule, not siblings of it. Declaring them as
            # siblings builds and runs fine locally but App Store Connect
            # rejects the upload with error 90360, "Missing Info.plist value. A
            # value for the key 'NSExtensionActivationRule' ... is required."
            #
            # Why these numbers: the share sheet only offers Zekktris when the
            # payload is something a message can actually carry. Generous on
            # images (a multi-photo share is the common case) and deliberately
            # modest elsewhere.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  NotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotificationService
      - path: Zekktris/E2EE.swift
      - path: Zekktris/AppGroupConfig.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        # MUST match the app's version/build or App Store upload is rejected
        # (ITMS). Bump alongside the app's CFBundleShortVersionString / the
        # MARKETING_VERSION + CURRENT_PROJECT_VERSION base settings.
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zekktris.native
        # No communication-notifications entitlement here either — see the note
        # on the app target above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # WidgetKit extension — the Home/Lock-Screen "Quick DM" widget. One-tap poke
  # via an App Intent (no app launch) + tap-to-message deep link. Reads the
  # recent DM list (app-group UserDefaults) + token (app-group keychain) the
  # app publishes via WidgetBridge. Reuses AppGroupConfig/Keychain/Config
  # (compiled directly, like the NSE) + the shared WidgetShared model. iOS 17+
  # (interactive widgets).
  ZekktrisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZekktrisWidgets
      - path: Zekktris/WidgetShared.swift
      - path: Zekktris/AppGroupConfig.swift
      - path: Zekktris/Keychain.swift
      - path: Zekktris/Config.swift
    info:
      path: ZekktrisWidgets/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ZekktrisWidgets/ZekktrisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zekktris.native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.widgets
        CODE_SIGN_STYLE: Automatic

  # watchOS companion — displays as "Zekktris" on the watch. A standalone
  # single-target watch app (WKApplication) for quick messages/pokes to a
  # recent DM peer. It does NOT compile the iOS app's
  # sources (no LiveKit etc.) — it's self-contained under ZekktrisWatch/ and
  # gets the auth token + poke targets from the phone over WatchConnectivity,
  # then calls POST /channels/:id/poke directly.
  ZekktrisWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZekktrisWatch
      # Shared with the watch widget: app-group keychain (token) + the group id.
      - path: Zekktris/Keychain.swift
      - path: Zekktris/AppGroupConfig.swift
      # Loose recipient matching for the spoken-shortcut send (App Intents),
      # the same ranking the iPhone's Siri extension uses.
      - path: Zekktris/SiriMatching.swift
    dependencies:
      # Bundles + embeds the watchOS widget/complication extension into the
      # watch app.
      - target: ZekktrisWatchWidgets
        embed: true
      # Siri on the wrist ("send a message to Sam on Zekktris") — watchOS
      # needs its own Intents extension; it won't use the iPhone's.
      - target: ZekktrisWatchIntents
        embed: true
    info:
      path: ZekktrisWatch/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        WKApplication: true
        # Ties this watch app to the iOS app so it installs alongside it.
        WKCompanionAppBundleIdentifier: com.zekktris.native
        # REQUIRED for the wrist's own Siri prompt. Siri authorisation is per
        # device — the iPhone's grant does not carry over — and the watch app
        # asks for it on launch (ZekktrisWatchApp). Without this key that call
        # traps, and without the grant Siri answers "you don't have an app for
        # that" instead of reaching ZekktrisWatchIntents.
        NSSiriUsageDescription: "Zekktris lets you send messages with Siri. Siri is told who you talk to and what you dictate, so it can send the message for you."
        # HOW SIRI HEARS THE APP NAME. "Zekktris" is an invented word, and
        # speech recognition almost never spells it with the double k. On the
        # iPhone that is forgiven — Siri matches App Shortcut phrases flexibly.
        # On Apple Watch it is NOT: phrases must match EXACTLY, so a
        # transcription of "Zektris" fails the "\(.applicationName)" token and
        # Siri answers "You'll need an app for me to help with that".
        # CFBundleSpokenName is the pronunciation (also used by VoiceOver);
        # INAlternativeAppNames (max 3) are extra spellings the
        # `.applicationName` token accepts. Do not repeat the display name.
        CFBundleSpokenName: "Zeck triss"
        INAlternativeAppNames:
          - INAlternativeAppName: Zektris
            INAlternativeAppNamePronunciationHint: zeck triss
          - INAlternativeAppName: Zeck Tris
            INAlternativeAppNamePronunciationHint: zeck triss
          - INAlternativeAppName: Zecktris
            INAlternativeAppNamePronunciationHint: zeck triss
        # Deep-link scheme so the watch Open-DM complication can open the watch
        # app at a friend (zekktris://friend/<id>) — handled in ZekktrisWatchApp.
        CFBundleURLTypes:
          - CFBundleURLName: com.zekktris.native.watchkitapp
            CFBundleURLSchemes:
              - zekktris
    entitlements:
      path: ZekktrisWatch/ZekktrisWatch.entitlements
      properties:
        # Watch-side App Group: the watch app publishes the DM list + token here
        # so the watch widget/complication can poke + open DMs on its own.
        com.apple.security.application-groups:
          - group.com.zekktris.native
        # SiriKit for the wrist. Needs SiriKit enabled on the
        # com.zekktris.native.watchkitapp App ID in the Developer portal, or
        # signing fails — same failure mode as the iPhone app's entitlement.
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        # An app icon is REQUIRED for App Store / TestFlight upload — without an
        # AppIcon asset the build omits CFBundleIconName and the upload is
        # rejected (error 90713). Reuses the iOS 1024 marketing icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # watchOS WidgetKit extension — complications + Smart Stack widgets for the
  # watch face: one-tap Poke, Open DM, and a Streaks readout. Reads the DM list
  # + token the watch app publishes to the shared App Group (reuses Keychain +
  # AppGroupConfig). watchOS 10 supports interactive (App Intent) widgets.
  ZekktrisWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZekktrisWatchWidgets
      - path: ZekktrisWatch/WatchWidgetBridge.swift
      - path: Zekktris/Keychain.swift
      - path: Zekktris/AppGroupConfig.swift
    info:
      path: ZekktrisWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ZekktrisWatchWidgets/ZekktrisWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zekktris.native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic

  # watchOS SiriKit Messaging extension. Reads what the watch app publishes to
  # the watch App Group (DM list with encryption flags and names, token, base
  # URL, per-DM keys in the app-group keychain) and sends through the watch's
  # own WatchPokeAPI, which already refuses plaintext into an encrypted DM.
  # Matching is the shared SiriMatching the iPhone extension uses.
  ZekktrisWatchIntents:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZekktrisWatchIntents
      - path: Zekktris/SiriMatching.swift
      - path: ZekktrisWatch/WatchWidgetBridge.swift
      - path: ZekktrisWatch/WatchPokeAPI.swift
      - path: Zekktris/Keychain.swift
      - path: Zekktris/AppGroupConfig.swift
    info:
      path: ZekktrisWatchIntents/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            # Must be a subset of the iPhone extension's IntentsSupported.
            IntentsSupported:
              - INSendMessageIntent
    entitlements:
      path: ZekktrisWatchIntents/ZekktrisWatchIntents.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zekktris.native
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.watchkitapp.intents
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic

  # Host-less logic-test target. Compiles E2EE.swift directly (no app host,
  # no LiveKit) so the crypto / call-key interop contract can be tested fast.
  # Run with:  xcodegen generate && xcodebuild test -scheme Zekktris \
  #              -destination 'platform=iOS Simulator,name=iPhone 16'
  # SiriKit Messaging extension — "Hey Siri, send a message to Sam on Zekktris".
  # Runs OUT OF PROCESS: it reads the recent DM list + token from the App Group
  # (WidgetShared) and the per-DM E2EE keys from the app-group keychain, exactly
  # as the widget and the Notification Service Extension do, so a send never
  # needs the app to launch. Compiles the same shared files they do — no
  # APIClient, no LiveKit.
  ZekktrisIntents:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZekktrisIntents
      - path: Zekktris/SiriMatching.swift
      - path: Zekktris/WidgetShared.swift
      - path: Zekktris/AppGroupConfig.swift
      - path: Zekktris/Keychain.swift
      - path: Zekktris/Config.swift
      - path: Zekktris/E2EE.swift
    info:
      path: ZekktrisIntents/Info.plist
      properties:
        CFBundleDisplayName: Zekktris
        # MUST match the app's version/build or App Store upload is rejected.
        CFBundleShortVersionString: "5.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
    entitlements:
      path: ZekktrisIntents/ZekktrisIntents.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zekktris.native
        # Same portal requirement as the app target — see the note there.
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.intents
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  ZekktrisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZekktrisTests
      - path: Zekktris/E2EE.swift
      # Siri recipient matching. Compiled in (rather than @testable-importing
      # the extension, which a unit-test bundle can't do) so the ranking that
      # decides WHO a voice message goes to is covered.
      - path: ZekktrisIntents/SendMessageIntentHandler.swift
      - path: Zekktris/SiriMatching.swift
      - path: Zekktris/WidgetShared.swift
      - path: Zekktris/AppGroupConfig.swift
      - path: Zekktris/Keychain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekktris.native.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Zekktris:
    build:
      targets:
        Zekktris: all
        ZekktrisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZekktrisTests
  ZekktrisWatch:
    build:
      targets:
        ZekktrisWatch: all
    run:
      config: Debug
  # Testing Siri WITHOUT speaking. Pick this scheme, then Edit Scheme → Run →
  # Info → "Siri Intent Query" and type the phrase, e.g.
  #   Send a message to Sam on Zekktris
  # Run: Xcode launches Siri with that phrase and attaches the debugger to the
  # extension, so breakpoints and print() in SendMessageIntentHandler work. The
  # scheme has to exist for the target to be selectable at all.
  ZekktrisIntents:
    build:
      targets:
        ZekktrisIntents: all
    run:
      config: Debug
